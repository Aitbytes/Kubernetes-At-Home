---
- hosts: k3s_cluster
  gather_facts: true
  become: yes
  roles:
    - role: prereq
    - role: download

- hosts: master
  become: true
  roles: 
    - role: k3s/master

- hosts: worker
  become: true
  roles: 
    - role: k3s/worker

- hosts: k3s_cluster
  become: true
  roles: 
    - role: deployments
