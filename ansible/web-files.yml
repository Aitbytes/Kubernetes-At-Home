---
- hosts: k3s_cluster
  gather_facts: true
  become: yes

  tasks:
    - name: Ensure the target directory exists
      file:
        path: /home/user/html-files/
        state: directory
        owner: user
        group: user
        mode: '0755'

    - name: Create a unique index.html file for each host
      template:
        src: templates/index.html.j2
        dest: /home/user/html-files/index.html
        owner: user
        group: user
        mode: '0644'

